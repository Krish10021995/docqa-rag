[project]
name = "docqa-rag"
version = "0.1.0"
description = "Production RAG over policy documents: LangGraph agent, pgvector hybrid search, reranking, citations, RAGAS evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langchain-postgres>=0.0.12,<1.0",
    "langchain-openai>=0.2,<1.0",
    "pgvector>=0.3,<0.6",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = [
    "langchain-huggingface>=0.1,<1.0",
    "sentence-transformers>=3.0,<4.0",
]
eval = [
    "ragas>=0.2,<0.3",
    "datasets>=3.0",
    "pandas>=2.2,<3.0",
]
tracing = [
    "langfuse>=2.41,<5.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pg: requires a reachable Postgres (pgvector) instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]