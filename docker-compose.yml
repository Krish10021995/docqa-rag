services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docqa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docqa"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DOCQA_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/docqa
      DOCQA_LLM_PROVIDER: stub
      DOCQA_EMBEDDING_PROVIDER: local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "docqa.server:app", "--host", "0.0.0.0", "--port", "8000"]

  ingest:
    build: .
    environment:
      DOCQA_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/docqa
      DOCQA_EMBEDDING_PROVIDER: local
    command: ["python", "-m", "docqa.ingestion", "data/policies", "--reset"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: